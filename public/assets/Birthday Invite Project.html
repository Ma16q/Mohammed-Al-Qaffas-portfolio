<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Invite | Mohammed Ahmed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="ambient-glow" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <div class="container subpage-wrapper">
    <a href="../index.html#projects" class="back-btn">
      <span aria-hidden="true">←</span>
      <span>Back</span>
    </a>

    <main class="subpage-card glass-panel" style="margin-top: 1.5rem; text-align: center;">
      <span class="section-pill">Birthday Invite</span>
      <h1 class="section-title" style="margin-top: 0.5rem;">It's My Birthday!</h1>
      <h2 style="font-size: 1.2rem; color: var(--accent-cyan); font-weight: 600; margin-bottom: 1.5rem;">
        15th August
      </h2>

      <div style="max-width: 380px; margin: 0 auto 1.5rem; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.15);">
        <img 
          src="https://raw.githubusercontent.com/appbrewery/webdev/main/birthday-cake3.4.jpeg" 
          alt="Birthday Cake" 
          style="width: 100%; height: auto; display: block;"
        >
      </div>

      <!-- IAU Google Maps Location -->
      <div style="margin-bottom: 1.5rem;">
        <a 
          href="https://www.google.com/maps/search/?api=1&query=Imam+Abdulrahman+Bin+Faisal+University" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="btn-primary"
        >
          <span>📍 Location: Imam Abdulrahman Bin Faisal University (IAU)</span>
        </a>
      </div>

      <div class="mini-glass-card" style="text-align: left; max-width: 420px; margin: 0 auto;">
        <h3 style="font-size: 1.05rem; font-weight: 700; margin-bottom: 0.5rem;">
          🎉 What to bring:
        </h3>
        <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.4rem; color: var(--text-muted); font-size: 0.9rem;">
          <li>📸 Phone (for cake photos)</li>
          <li>✍️ Handwritten message</li>
          <li>🎁 Gift</li>
        </ul>
      </div>

      <div style="margin-top: 2rem;">
        <a href="../index.html" class="btn-secondary">
          <span>Return to Portfolio</span>
        </a>
      </div>
    </main>
  </div>
</body>
</html>
